name: LLVM Build

on:
  push:
    branches: [main]
    paths:
      - cmake/llvm-hash.txt
  pull_request:
    paths:
      - .github/workflows/llvm-build.yml
  workflow_dispatch:
    inputs:
      llvm-hash:
        description: "Full 40-character LLVM commit SHA to build (overrides cmake/llvm-hash.txt)"
        required: false
        type: string

# Release create/upload/delete (publishing the LLVM build as a release asset).
permissions:
  contents: write

env:
  SCCACHE_DIR: ${{ github.workspace }}/sccache
  # Keep this many most-recent llvm-* releases; older ones are pruned on bump.
  LLVM_RELEASE_KEEP: 10

jobs:

  # Read the pinned LLVM commit once so all downstream jobs share the same value.
  get-hash:
    runs-on: ubuntu-22.04
    outputs:
      llvm-hash:       ${{ steps.read.outputs.llvm-hash }}
      llvm-short-hash: ${{ steps.read.outputs.llvm-short-hash }}
      release-tag:     ${{ steps.read.outputs.release-tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Read LLVM commit hash
        id: read
        run: |
          # workflow_dispatch input takes precedence over the pinned file.
          # If neither is present, fall back to empty string — downstream jobs
          # that need a hash (build) will skip; jobs that don't (trigger-ci
          # with mlir_wheel) are unaffected.
          LLVM_HASH="${{ inputs.llvm-hash }}"
          if [ -z "$LLVM_HASH" ]; then
            LLVM_HASH=$(cat cmake/llvm-hash.txt 2>/dev/null || echo "")
          fi
          SHORT="${LLVM_HASH:0:8}"
          echo "llvm-hash=$LLVM_HASH"       >> $GITHUB_OUTPUT
          echo "llvm-short-hash=$SHORT"     >> $GITHUB_OUTPUT
          echo "release-tag=llvm-$SHORT"    >> $GITHUB_OUTPUT

  # Create the shared llvm-<short> prerelease once, before the build matrix
  # fans out.  Each build job then just uploads its own platform asset to this
  # existing release — no create race across the 3 parallel jobs.
  # Skipped on PRs (which build + package to validate the workflow only).
  create-release:
    needs: get-hash
    if: ${{ needs.get-hash.outputs.llvm-hash != '' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Create release if absent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.get-hash.outputs.release-tag }}"
          SHORT="${{ needs.get-hash.outputs.llvm-short-hash }}"
          # Idempotent: a re-run (or a hash whose release already exists) is a no-op.
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --prerelease --target main \
                 --title "LLVM $SHORT" \
                 --notes "Prebuilt LLVM/MLIR for ktir pin $SHORT (build-input cache, not a software release)."

  build:
    name: Build LLVM (${{ matrix.config.runner }})
    needs: [get-hash, create-release]
    # create-release is skipped on PRs; build must still run there (build +
    # package validates the workflow). Tolerate skipped, require not-failed.
    if: ${{ !cancelled() && needs.get-hash.outputs.llvm-hash != '' && needs.create-release.result != 'failure' }}
    runs-on: ${{ matrix.config.runs-on }}

    strategy:
      fail-fast: true
      matrix:
        config:
          - { runner: "Ubuntu 22.04 x64",   runs-on: "ubuntu-22.04",     os: "ubuntu", arch: "x64",   linker: "lld" }
          - { runner: "macOS 15 ARM64",      runs-on: "macos-15",         os: "macos",  arch: "arm64", linker: ""    }
          - { runner: "Ubuntu 22.04 ARM64",  runs-on: "ubuntu-22.04-arm", os: "ubuntu", arch: "arm64", linker: "lld" }

    steps:
      - uses: actions/checkout@v4

      # Skip the build if this platform's asset is already attached to the
      # llvm-<short> release.  gh needs a repo context, hence the checkout above.
      - name: Check existing release asset
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT="${{ needs.get-hash.outputs.llvm-short-hash }}"
          TAG="${{ needs.get-hash.outputs.release-tag }}"
          ARTIFACT_NAME="llvm-${SHORT}-${{ matrix.config.os }}-${{ matrix.config.arch }}"
          echo "artifact-name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT
          if gh release view "$TAG" --json assets \
               -q '.assets[].name' 2>/dev/null | grep -qx "${ARTIFACT_NAME}.tar.gz"; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "::notice::Release asset ${ARTIFACT_NAME}.tar.gz already exists; skipping build"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set artifact name
        if: steps.check.outputs.exists != 'true'
        run: echo "LLVM_INSTALL_DIR=${{ steps.check.outputs.artifact-name }}" >> $GITHUB_ENV

      - name: Checkout LLVM
        if: steps.check.outputs.exists != 'true'
        uses: actions/checkout@v4
        with:
          repository: llvm/llvm-project
          path: llvm-project
          ref: ${{ needs.get-hash.outputs.llvm-hash }}

      # Detect whether this commit is a stable release tag (llvmorg-*).
      # git ls-remote checks the remote directly — no checkout or fetch-tags needed.
      # Stable builds skip check-mlir and assertions; any regressions in ktir
      # itself will surface in cmake-py-test.
      - name: Detect stable build
        if: steps.check.outputs.exists != 'true'
        run: |
          LLVM_HASH="${{ needs.get-hash.outputs.llvm-hash }}"
          if git ls-remote https://github.com/llvm/llvm-project 'refs/tags/llvmorg-*^{}' \
               | grep -q "^${LLVM_HASH}"; then
            echo "IS_STABLE_BUILD=true"  >> $GITHUB_ENV
          else
            echo "IS_STABLE_BUILD=false" >> $GITHUB_ENV
          fi

      - name: Install uv
        if: steps.check.outputs.exists != 'true'
        uses: astral-sh/setup-uv@v5

      - name: Install prerequisites
        if: steps.check.outputs.exists != 'true'
        run: |
          # numpy<2 is only needed for check-mlir's Python tests; stable builds skip it
          if [ "$IS_STABLE_BUILD" = "true" ]; then
            uv sync --group llvm-build --no-install-project
          else
            uv sync --group llvm-build-nightly --no-install-project
          fi
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Enable sccache
        if: steps.check.outputs.exists != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key:          ${{ matrix.config.os }}-${{ matrix.config.arch }}-${{ needs.get-hash.outputs.llvm-short-hash }}
          restore-keys: ${{ matrix.config.os }}-${{ matrix.config.arch }}-
          save-always: true

      # MLIR_ENABLE_BINDINGS_PYTHON=ON exports MLIRPythonSources.Core and related
      # cmake targets into the install tree. These are required by downstream
      # consumers (cmake-py-test) to build the ktir Python wheel via scikit-build-core.
      - name: Configure LLVM
        if: steps.check.outputs.exists != 'true'
        run: |
          CMAKE_ARGS=(
            -GNinja -B llvm-project/build
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_C_COMPILER=clang
            -DCMAKE_CXX_COMPILER=clang++
            -DCMAKE_C_COMPILER_LAUNCHER=sccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
            -DCMAKE_INSTALL_PREFIX="${{ env.LLVM_INSTALL_DIR }}"
            -DLLVM_ENABLE_PROJECTS="mlir"
            -DLLVM_TARGETS_TO_BUILD="host"
            -DLLVM_BUILD_UTILS=ON
            -DLLVM_INSTALL_UTILS=ON
            -DLLVM_ENABLE_ZSTD=OFF
            -DLLVM_ENABLE_TERMINFO=OFF
            -DLLVM_ENABLE_LIBXML2=OFF
            -DMLIR_ENABLE_BINDINGS_PYTHON=ON
            # Use uv-managed Python so MLIRDetectPythonEnv finds nanobind on all platforms
            -DPython3_EXECUTABLE="$(uv python find)"
          )
          # lld is 2-4x faster than GNU ld for linking; leave empty on macOS (ld64 is fast on ARM64)
          [ -n "${{ matrix.config.linker }}" ] && CMAKE_ARGS+=( -DLLVM_USE_LINKER="${{ matrix.config.linker }}" )
          if [ "$IS_STABLE_BUILD" = "true" ]; then
            CMAKE_ARGS+=(
              -DLLVM_INCLUDE_TESTS=OFF
              -DLLVM_INCLUDE_EXAMPLES=OFF
              -DLLVM_INCLUDE_BENCHMARKS=OFF
            )
          else
            # Assertions catch MLIR internal invariant violations in nightly builds;
            # unnecessary overhead for a vetted stable tag.
            CMAKE_ARGS+=( -DLLVM_ENABLE_ASSERTIONS=ON )
          fi
          cmake "${CMAKE_ARGS[@]}" llvm-project/llvm

      - name: Build and install LLVM
        if: steps.check.outputs.exists != 'true'
        run: |
          if [ "$IS_STABLE_BUILD" = "true" ]; then
            ninja -C llvm-project/build install
          else
            ninja -C llvm-project/build check-mlir install
          fi

      - name: Package
        if: steps.check.outputs.exists != 'true'
        run: tar czf "${{ env.LLVM_INSTALL_DIR }}.tar.gz" "${{ env.LLVM_INSTALL_DIR }}"

      # Upload the tarball to the llvm-<short> prerelease that the create-release
      # job already made — each matrix job uploads its own platform asset, so no
      # create race.  PRs skip this (create-release didn't run; build + package
      # validates the workflow only).  --clobber keeps re-runs idempotent.
      - name: Publish release asset
        if: ${{ steps.check.outputs.exists != 'true' && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.get-hash.outputs.release-tag }}" \
            "${{ env.LLVM_INSTALL_DIR }}.tar.gz" --clobber

      - name: Dump sccache statistics
        if: steps.check.outputs.exists != 'true'
        run: sccache --show-stats

  # Trigger CI against the freshly built LLVM artifact.
  # Only runs when a hash was resolved — ci.yml already runs independently
  # on push/PR with mlir_wheel, so triggering it here with mlir_wheel would
  # be a duplicate.
  trigger-ci:
    needs: [get-hash, build]
    if: ${{ needs.get-hash.outputs.llvm-hash != '' }}
    uses: ./.github/workflows/ci.yml
    with:
      mlir-source:     custom
      llvm-short-hash: ${{ needs.get-hash.outputs.llvm-short-hash }}
      artifact-repo:   ${{ github.repository }}

  # Prune old llvm-* releases, keeping the newest $LLVM_RELEASE_KEEP.
  # Release assets never expire, so this bounds storage the way the old
  # "delete old artifact" step did.  Runs only on a real publish (push to main
  # or manual dispatch), after the build succeeded.
  prune:
    needs: [get-hash, build]
    if: ${{ needs.get-hash.outputs.llvm-hash != '' && github.event_name != 'pull_request' }}
    # Serialize prune across overlapping runs (e.g. two hash bumps merged close
    # together) so two prune jobs never list/delete the same tags concurrently.
    concurrency: llvm-prune
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Prune old llvm-* releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Newest-first by creation; keep the top N, delete the rest (tag too).
          gh release list --limit 200 --json tagName,createdAt \
            -q '[.[] | select(.tagName | startswith("llvm-"))]
                 | sort_by(.createdAt) | reverse
                 | .['"$LLVM_RELEASE_KEEP"':] | .[].tagName' \
            | while read -r TAG; do
                [ -z "$TAG" ] && continue
                echo "Pruning $TAG"
                gh release delete "$TAG" --cleanup-tag --yes
              done
